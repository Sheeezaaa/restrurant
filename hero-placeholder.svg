<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="heroGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#233F34"/>
      <stop offset="60%" stop-color="#14261F"/>
      <stop offset="100%" stop-color="#09130F"/>
    </radialGradient>
    <pattern id="patternDots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#C2A06E" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#heroGlow)"/>
  <rect width="100%" height="100%" fill="url(#patternDots)"/>
  
  <g transform="translate(960, 500)">
    <!-- Decorative Emblems -->
    <circle cx="0" cy="-60" r="70" fill="none" stroke="#C2A06E" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="-60" r="54" fill="none" stroke="#C2A06E" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
    <text x="0" y="-48" font-family="'Cormorant Garamond', Georgia, serif" font-size="38" fill="#C2A06E" text-anchor="middle">✦</text>
    
    <text x="0" y="50" font-family="'Cormorant Garamond', Georgia, serif" font-size="44" font-weight="600" fill="#FAF7F2" text-anchor="middle" letter-spacing="6">AURA FINE DINING</text>
    <text x="0" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#C2A06E" text-anchor="middle" letter-spacing="4">OFFLINE ARTISANAL GASTRONOMY PREVIEW</text>
  </g>
</svg>
