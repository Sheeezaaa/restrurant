<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="dishGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#243F34"/>
      <stop offset="70%" stop-color="#172B23"/>
      <stop offset="100%" stop-color="#0E1A15"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#dishGrad)"/>
  
  <g transform="translate(400, 300)">
    <!-- Plate silhouette -->
    <circle cx="0" cy="-20" r="110" fill="#1C352B" stroke="#C2A06E" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="-20" r="85" fill="#172B23" stroke="#C2A06E" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
    <circle cx="0" cy="-20" r="45" fill="#243F34" stroke="#C2A06E" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Cloche or star icon -->
    <text x="0" y="-10" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" fill="#C2A06E" text-anchor="middle">✦</text>
    
    <text x="0" y="130" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="600" fill="#FAF7F2" text-anchor="middle" letter-spacing="2">ARTISAN GASTRONOMY</text>
    <text x="0" y="156" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#C2A06E" text-anchor="middle" letter-spacing="3">AURA SEASONAL DISH</text>
  </g>
</svg>
